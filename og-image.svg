<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Floating nodes -->
  <circle cx="900" cy="120" r="4" fill="#22d3ee" opacity="0.5"/>
  <circle cx="1050" cy="200" r="5" fill="#34d399" opacity="0.4"/>
  <circle cx="1120" cy="400" r="4" fill="#38bdf8" opacity="0.3"/>
  <circle cx="950" cy="480" r="5" fill="#22d3ee" opacity="0.4"/>
  <circle cx="850" cy="350" r="3" fill="#34d399" opacity="0.5"/>
  <line x1="900" y1="120" x2="1050" y2="200" stroke="#22d3ee" stroke-width="0.7" opacity="0.25"/>
  <line x1="1050" y1="200" x2="1120" y2="400" stroke="#34d399" stroke-width="0.7" opacity="0.25"/>
  <line x1="850" y1="350" x2="950" y2="480" stroke="#38bdf8" stroke-width="0.7" opacity="0.25"/>
  <line x1="1050" y1="200" x2="850" y2="350" stroke="#22d3ee" stroke-width="0.7" opacity="0.2"/>

  <!-- X Logo -->
  <g filter="url(#glow)" stroke="url(#g)" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(80, 115) scale(0.8)">
    <path d="M120,110 L210,250 L120,390" stroke-width="24"/>
    <path d="M380,110 L290,250 L380,390" stroke-width="24"/>
    <path d="M210,250 L250,310 M290,250 L250,190" stroke-width="24"/>
    <path d="M100,100 L220,100 L250,150 L280,100 L400,100 L280,280 L400,400 L280,400 L250,350 L220,400 L100,400 L220,220 Z" stroke-width="16" opacity="0.85"/>
  </g>

  <!-- Main Title -->
  <text x="520" y="240" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" fill="white">XTech</text>
  <text x="520" y="320" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" fill="white">Consultant</text>

  <!-- Subtitle -->
  <text x="522" y="380" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" fill="#22d3ee">Automatización IA · Big Data · Apps · CRM</text>

  <!-- Divider -->
  <rect x="520" y="405" width="400" height="1" fill="#1e293b"/>

  <!-- URL -->
  <text x="522" y="445" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#64748b">www.xtechconsultant.com</text>

  <!-- Tagline -->
  <text x="522" y="490" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#94a3b8">Tu competencia ya automatizó. ¿Y tú?</text>

  <!-- Tech pills -->
  <rect x="522" y="515" width="80" height="24" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
  <text x="562" y="532" font-family="Inter, sans-serif" font-size="12" fill="#22d3ee" text-anchor="middle">Pipeline</text>

  <rect x="612" y="515" width="110" height="24" rx="12" fill="none" stroke="#34d399" stroke-width="1" opacity="0.6"/>
  <text x="667" y="532" font-family="Inter, sans-serif" font-size="12" fill="#34d399" text-anchor="middle">IA Cognitiva</text>

  <rect x="732" y="515" width="90" height="24" rx="12" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <text x="777" y="532" font-family="Inter, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">Supabase</text>

  <rect x="832" y="515" width="72" height="24" rx="12" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.6"/>
  <text x="868" y="532" font-family="Inter, sans-serif" font-size="12" fill="#818cf8" text-anchor="middle">Next.js</text>
</svg>
