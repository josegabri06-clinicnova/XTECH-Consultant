  <line x1='1350' y1='180' x2='1480' y2='120' stroke='#34d399' stroke-width='0.7' opacity='0.3'/>
  <line x1='1100' y1='260' x2='1350' y2='180' stroke='#38bdf8' stroke-width='0.7' opacity='0.3'/>
  <line x1='1350' y1='180' x2='1420' y2='300' stroke='#22d3ee' stroke-width='0.7' opacity='0.3'/>
