<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradient for X -->
    <linearGradient id="xTechGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="none" />
  
  <g filter="url(#neonGlow)">
    <!-- Inner complex lines of the "X" -->
    <path d="M 120,110 L 210,250 L 120,390" 
          fill="none" 
          stroke="url(#xTechGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <path d="M 380,110 L 290,250 L 380,390" 
          fill="none" 
          stroke="url(#xTechGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <path d="M 210,250 L 250,310 M 290,250 L 250,190" 
          fill="none" 
          stroke="url(#xTechGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Dynamic outer enclosing geometry -->
    <path d="M 100,100 L 220,100 L 250,150 L 280,100 L 400,100 L 280,280 L 400,400 L 280,400 L 250,350 L 220,400 L 100,400 L 220,220 Z" 
          fill="none" 
          stroke="url(#xTechGrad)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.85" />
  </g>
</svg>
